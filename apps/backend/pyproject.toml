[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-ai"
version = "0.1.0"
description = "Guardian AI backend: FastAPI + LangGraph agentic code-review service."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi",
  "uvicorn",
  "langgraph",
  "sqlalchemy",
  "psycopg[binary]",
  "pydantic-settings",
  "python-dotenv",
  "alembic",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "httpx",
  "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` as an argument default is FastAPI's documented dependency
# injection idiom, not the mutable-default-argument bug B008 warns about.
extend-immutable-calls = ["fastapi.Depends"]
